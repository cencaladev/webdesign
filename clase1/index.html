<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 1 - Landing Page</title>

    <!-- CSS -->
    <style>
        html {
            scroll-behavior: smooth;
        }

        body, html {
            margin: 0;
        }

        section {
            border: 1px solid;
            height: 300px;
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        nav {
            border: 1px solid blue;
            position: fixed;
            background-color: rgba(95, 158, 160, 0.39);
            width: 100%;
            top: 0;
        }

        nav ul {
            display: flex;
            gap: 10px;
            justify-content: end;
            height: 30px;
            padding: 0 10px;
        }

        nav ul li {
            padding: 5px;
            list-style: none;
        }

        nav ul li a {
            background-color: aquamarine;
            padding: 8px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            background-color: lightblue;
            text-decoration: underline;
            font-weight: bold;
        }

        #inicio {
            margin-top: 80px;
        }
    </style>

    <!-- JavaScript -->
    <script></script>

</head>

<body>
    <nav>
        <ul>
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#problema">Problema/Solución</a></li>
            <li><a href="#beneficio">Beneficios</a></li>
            <li><a href="#como">Cómo funciona</a></li>
            <li><a href="#feat">Features</a></li>
        </ul>
    </nav>
    <section id="inicio">Inicio</section>
    <section id="problema">Problema/Solución</section>
    <section id="beneficio">Beneficios</section>
    <section id="como">Cómo funciona</section>
    <section id="feat">Features</section>
</body>

</html>
