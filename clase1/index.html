<html lang="es">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clase 1 - Landing Page</title>

    <!-- CSS -->
    <style>
        section {
            border: 1px solid;
            height: 300px;
            margin: 10px;
            padding: 10px;
            border-radius: 5px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        nav {
            border: 1px solid blue;
        }

        nav ul {
            height: 30px;
        }

        nav ul li {
            float: left;
            padding: 5px;
            list-style: none;
        }

        nav ul li a {
            background-color: aquamarine;
            padding: 8px;
            border-radius: 5px;
            text-decoration: none;
        }

        nav ul li a:hover {
            background-color: lightblue;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>

    <!-- JavaScript -->
    <script></script>

</head>

        <ul>

        </ul>
